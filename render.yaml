services:
  - type: web
    name: iac
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: datos
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
