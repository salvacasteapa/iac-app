<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuesta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1f4fd1;--bg:#f4f5f8;--ink:#1b2130;--quiet:#5f6878;--line:#e0e3e9;--me:#e9eefc}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{background:#0b1630;color:#fff;border-bottom:3px solid var(--brand)}
.brand img{background:#fff;border-radius:8px;padding:4px 6px}
header .small{color:#9aa6c4!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;width:100%}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand img{max-height:40px;max-width:180px}
.mono{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.deal{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(16,24,40,.06);padding:14px 16px;margin:16px 0 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.deal b{font-size:16px}
.deal .muted{color:var(--quiet);font-size:13.5px}
.offer{text-align:right}
.offer .v{font-size:22px;font-weight:800;color:var(--brand)}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--quiet);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0}
.notice svg{flex:none;margin-top:2px}
main{flex:1}
.log{display:flex;flex-direction:column;gap:10px;padding:8px 0 16px}
.msg{max-width:82%;padding:11px 15px;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05);font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg .who{font-size:11.5px;font-weight:700;margin-bottom:2px;color:var(--quiet)}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.msg.them .who{color:var(--brand)}
.msg.you{align-self:flex-end;background:var(--me)}
.typing{align-self:flex-start;color:var(--quiet);font-size:13px;padding:4px 6px}
.status{text-align:center;border-radius:10px;padding:10px;margin:6px 0 12px;font-weight:600;font-size:14px}
.status.ok{background:#e6f5ee;color:#0f7a52}.status.wait{background:#fff3df;color:#9a5d00}.status.no{background:#fdecea;color:#b42318}
footer{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0}
form{display:flex;gap:8px}
textarea{flex:1;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;height:46px;max-height:140px;color:var(--ink);background:#fff}
textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 35%,transparent);border-color:var(--brand)}
button{font:inherit;font-weight:600;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;cursor:pointer}
button.p{background:var(--brand);border-color:var(--brand);color:#fff}
button:disabled{opacity:.5;cursor:default}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.quick button{font-size:13.5px;padding:7px 12px}
.err{color:#b42318;font-size:13px;margin-top:6px}
.hidden{display:none!important}
.sc{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(16,24,40,.06);padding:14px 16px;margin:12px 0}
.sc summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.sc summary::-webkit-details-marker{display:none}
.sc summary::after{content:"Ver";font-size:13px;color:var(--brand);font-weight:600}
.sc[open] summary::after{content:"Ocultar"}
.gal{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.gal .big{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#eef0f5}
.th{display:flex;gap:6px;flex-wrap:wrap}.th img{width:64px;height:48px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.6;border:2px solid transparent}.th img.on{opacity:1;border-color:var(--brand)}
.sc video{width:100%;border-radius:12px;background:#000;max-height:320px;margin-top:8px}
.sc .desc{white-space:pre-wrap;font-size:14.5px;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:#e6f5ee;color:#0b7a52;text-decoration:none}
.prj{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.prj button{padding:0;text-align:left;border-radius:12px;overflow:hidden;background:#fff}
.prj img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef0f5}
.prj span{display:block;padding:8px 10px;font-size:13px}
.pv{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.q{border-left:3px solid var(--brand);background:#f8f9fc;border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;font-size:14px}
.q i{display:block}.q small{color:var(--quiet)}
.codes{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
.codes .pair{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.codes code{font:600 14px ui-monospace,monospace;background:#f1f3f8;border-radius:6px;padding:3px 8px}
.codes form{display:flex;gap:8px;margin-top:8px}.codes input{flex:1;font:600 14px ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.codes .ok{color:#0f7a52;font-weight:600}
.small{font-size:12px;color:var(--quiet);text-align:center;margin-top:8px}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand" id="brand"></div><span class="small" id="who"></span></div></header>
<main><div class="wrap">
  <div class="deal" id="deal"></div>
  <div class="notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span id="notice"></span></div>
  <div class="codes" id="codes"></div>
  <div id="sc"></div>
  <div id="status"></div>
  <div class="log" id="log"></div>
</div></main>
<footer><div class="wrap">
  <div class="quick" id="quick"><button type="button" id="accept">Aceptar la propuesta</button><button type="button" id="human">Hablar con una persona</button></div>
  <form id="f"><textarea id="t" placeholder="Escriba su respuesta o su precio…" aria-label="Mensaje"></textarea><button class="p" id="send">Enviar</button></form>
  <div class="err" id="err"></div>
</div></footer>
<script>
const token = location.pathname.split('/').pop();
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => Number(n).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
let S = null, busy = false, count = 0;

function render(d){
  S = d; const c = d.company;
  document.documentElement.style.setProperty('--brand', c.color || '#1f4fd1');
  document.title = `${c.name} · ${d.product_name}`;
  $('#brand').innerHTML = c.logo ? `<img src="${h(c.logo)}" alt="${h(c.name)}">` : `<span class="mono">${h(c.name.slice(0,2).toUpperCase())}</span>${h(c.name)}`;
  $('#who').textContent = d.side === 'compra' ? 'Solicitud de compra' : 'Propuesta comercial';
  const shown = d.price ?? d.our_offer;
  $('#deal').innerHTML = `<div><b>${h(d.product_name)}</b><div class="muted">${d.qty} ${h(d.unit)}${d.days ? ` · entrega en ${d.days} días` : ''}</div></div>
    <div class="offer"><div class="muted">${d.price != null ? 'Precio acordado' : 'Propuesta actual'}</div><div class="v">${eur(shown)} <span class="muted">/ ${h(d.unit)}</span></div></div>`;
  $('#notice').textContent = `Está conversando con el asistente ${d.side === 'compra' ? 'de compras' : 'comercial'} de ${c.name}, que trabaja con las condiciones fijadas por su equipo y está supervisado por ${d.supervisor || 'una persona'}. Puede pedir hablar con una persona en cualquier momento.`;
  const theirs = d.side === 'venta' ? 'buyer_code' : 'mfr_code', label = d.side === 'venta' ? 'Su código de artículo' : 'Su código de fabricante';
  const cbox = $('#codes');
  if (!cbox.contains(document.activeElement)) cbox.innerHTML = `<b>Códigos del artículo</b><div class="pair"><span>Fabricante: <code>${h(d.mfr_code || '—')}</code></span><span>Cliente: <code>${h(d.buyer_code || '—')}</code></span></div>`
    + (d.cp_code_ok ? '<div class="ok">✔ Ha confirmado que estos códigos corresponden al artículo.</div>'
      : ['cerrada','cancelada'].includes(d.status) ? '' : `<div class="muted" style="color:var(--quiet);font-size:13px">Para evitar errores, ${d[theirs] ? 'confirme que el código es correcto' : 'indíquenos ' + label.toLowerCase()}.</div><form id="fc">${d[theirs] ? '' : `<input id="cc" placeholder="${label}" aria-label="${label}" required>`}<button class="p">${d[theirs] ? 'Confirmar códigos' : 'Enviar y confirmar'}</button></form>`);
  const fc = $('#fc'); if (fc) fc.onsubmit = e => { e.preventDefault(); const i = $('#cc'); send({ action: 'codigos', code: i ? i.value.trim() : '' }); };
  const ST = { cerrada:['ok','Acuerdo cerrado · total ' + (d.total!=null?eur(d.total):'')], pendiente:['wait','Acuerdo pendiente de confirmación por ' + (d.supervisor || 'el responsable')], humano:['wait','Le atenderá personalmente ' + (d.supervisor || 'una persona del equipo')], sin_acuerdo:['no','Sin acuerdo por ahora. Puede seguir escribiendo si quiere proponer otra opción.'], cancelada:['no','Esta negociación se ha cancelado.'] };
  const st = ST[d.status];
  $('#status').innerHTML = st ? `<div class="status ${st[0]}">${h(st[1])}</div>` : '';
  const name = d.side === 'compra' ? `Compras · ${c.name}` : `${c.name}`;
  $('#log').innerHTML = d.messages.map(m => `<div class="msg ${m.who === 'you' ? 'you' : 'them'}"><div class="who">${m.who === 'you' ? 'Usted' : m.who === 'staff' ? h(d.supervisor || c.name) : 'Asistente · ' + h(name)}</div>${h(m.text)}</div>`).join('');
  const closed = ['cerrada','cancelada'].includes(d.status);
  $('#f').classList.toggle('hidden', closed); $('#quick').classList.toggle('hidden', closed || d.status === 'pendiente');
  $('#human').classList.toggle('hidden', d.agent_paused);
  if (d.messages.length !== count) { count = d.messages.length; scrollTo(0, document.body.scrollHeight); }
}
async function load(){ try { const r = await fetch('/api/public/n/' + token); if (r.ok) render(await r.json()); else $('#log').innerHTML = '<p>Este enlace no es válido.</p>'; } catch {} }
async function send(body){
  if (busy) return; busy = true; $('#err').textContent = ''; $('#send').disabled = true;
  if (body.text) { S.messages.push({who:'you', text: body.text}); render(S); }
  $('#log').insertAdjacentHTML('beforeend', '<div class="typing" id="typing">Escribiendo…</div>'); scrollTo(0, document.body.scrollHeight);
  try {
    const r = await fetch('/api/public/n/' + token, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Error');
    await new Promise(res => setTimeout(res, 600)); render(j);
  } catch (e) { $('#err').textContent = e.message; load(); }
  finally { busy = false; $('#send').disabled = false; const t = $('#typing'); if (t) t.remove(); }
}
$('#f').onsubmit = e => { e.preventDefault(); const text = $('#t').value.trim(); if (!text) return; $('#t').value = ''; send({ text }); };
$('#t').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#f').requestSubmit(); } });
$('#accept').onclick = () => send({ action: 'aceptar' });
$('#human').onclick = () => send({ action: 'humano' });
function gallery(photos){ if(!photos.length) return ''; return `<div class="gal"><img class="big" src="${h(photos[0].url)}" alt="">${photos.length>1?`<div class="th">${photos.map((x,i)=>`<img src="${h(x.url)}" class="${i?'':'on'}" alt="">`).join('')}</div>`:''}</div>`; }
function bindGal(root){ root.querySelectorAll('.gal').forEach(g=>g.querySelectorAll('.th img').forEach(t=>t.onclick=()=>{ g.querySelector('.big').src=t.src; g.querySelectorAll('.th img').forEach(x=>x.classList.toggle('on',x===t)); })); }
async function loadShowcase(){
  try {
    const r = await fetch('/api/public/showcase/' + token); const s = r.ok ? await r.json() : null; if (!s) return;
    const p = s.products[0]; let out = '';
    if (p && (p.photos.length || p.video || p.description || p.certs.length)) out += `<details class="sc"${innerWidth > 700 ? " open" : ""}><summary>${h(p.name)} · fotos y ficha</summary>${gallery(p.photos)}${p.video?`<video src="${h(p.video.url)}" controls preload="metadata"></video>`:''}${p.description?`<p class="desc">${h(p.description)}</p>`:''}${p.certs.length?`<div class="chips">${p.certs.map(c=>`<${c.file?`a href="${h(c.file.url)}" target="_blank" rel="noopener"`:'span'} class="chip">✓ ${h(c.name)}</${c.file?'a':'span'}>`).join('')}</div>`:''}</details>`;
    const certs = s.certificates.filter(c => !p || !p.certs.some(x => x.id === c.id));
    if (certs.length) out += `<details class="sc"><summary>Certificados de ${h(s.company.name)}</summary><div class="chips">${certs.map(c=>`<${c.file?`a href="${h(c.file.url)}" target="_blank" rel="noopener"`:'span'} class="chip">✓ ${h(c.name)}${c.issuer?' · '+h(c.issuer):''}</${c.file?'a':'span'}>`).join('')}</div></details>`;
    if (s.projects.length) out += `<details class="sc"><summary>Proyectos realizados (${s.projects.length})</summary><div class="prj">${s.projects.map((j,i)=>`<button type="button" data-j="${i}">${j.photos[0]?`<img src="${h(j.photos[0].url)}" alt="">`:''}<span><b>${h(j.title)}</b><br>${[j.client,j.location,j.year].filter(Boolean).map(h).join(' · ')}</span></button>`).join('')}</div><div id="pv"></div></details>`;
    const box = $('#sc'); box.innerHTML = out; bindGal(box);
    box.querySelectorAll('[data-j]').forEach(b => b.onclick = () => { const j = s.projects[+b.dataset.j]; const pv = $('#pv');
      pv.innerHTML = `<div class="pv"><b>${h(j.title)}</b>${gallery(j.photos)}${j.description?`<p class="desc">${h(j.description)}</p>`:''}${j.comments.map(c=>`<div class="q"><i>“${h(c.text)}”</i><small>— ${h(c.author||'Cliente')}${c.date?' · '+h(c.date):''}</small></div>`).join('')}</div>`; bindGal(pv); pv.scrollIntoView({behavior:'smooth',block:'nearest'}); });
  } catch {}
}
load(); loadShowcase(); setInterval(() => { if (!busy && !document.hidden) load(); }, 6000);
</script>
</body>
</html>
